<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microfinance IS</title>
  <!-- Bootstrap 5 from CDN: ready-made styles, no installation needed -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Microfinance IS</a>
      <span class="text-white">
        <a href="/docs" class="btn btn-sm btn-outline-light me-2">API docs</a>
        {% if user_name %}{{ user_name }}
          <a href="/logout" class="btn btn-sm btn-light ms-2">Logout</a>{% endif %}
      </span>
    </div>
  </nav>
  <div class="container mb-5">
    {% block content %}{% endblock %}
  </div>
  <script>
    // Shared helpers for all pages.
    // esc() makes text safe before we put it into HTML (protects from XSS).
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    // Pick a Bootstrap color for each status.
    function badge(status) {
      if (status === "Approved" || status === "Paid" || status === "PASS") return "success";
      if (status === "Rejected" || status === "FAIL") return "danger";
      return "warning";
    }
    function money(x) { return Number(x).toLocaleString("ru-RU", {maximumFractionDigits: 2}) + " ₸"; }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
